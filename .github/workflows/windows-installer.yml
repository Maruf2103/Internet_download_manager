name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    paths: ['idm/**', 'packaging/**', 'tools/build_windows.py', 'pyproject.toml', '.github/workflows/windows-installer.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test application and build wheel
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements-dev.txt
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
          python -m unittest discover -s tests -v
          python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - name: Assemble verified offline Windows package
        run: python tools/build_windows.py
      - name: Validate native Windows app and Chrome integration
        run: python tools/windows_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Windows-x64
          path: |
            dist/Flow-*-Windows-x64.zip
            dist/Flow-*-Windows-x64.zip.sha256
