name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    paths: ['idm/**', 'packaging/**', 'tools/build_windows.py', 'pyproject.toml', '.github/workflows/windows-installer.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test application and build wheel
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
          python -m unittest discover -s tests -v
          python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - name: Assemble verified offline Windows package
        run: python tools/build_windows.py
      - name: Install, launch, reuse, quit, and uninstall with bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flowZip = Get-ChildItem dist/Flow-*-Windows-x64.zip | Select-Object -First 1
          Expand-Archive $flowZip.FullName "$env:RUNNER_TEMP/FlowRelease"
          $flowRelease = Get-ChildItem "$env:RUNNER_TEMP/FlowRelease" -Directory | Select-Object -First 1
          $flowPython = Join-Path $flowRelease.FullName 'runtime/python.exe'
          & $flowPython -I "$($flowRelease.FullName)/install.py" --check
          if ($LASTEXITCODE -ne 0) { throw 'Payload check failed' }
          $flowPrefix = "$env:RUNNER_TEMP/FlowInstalled"
          & $flowPython -I "$($flowRelease.FullName)/install.py" --prefix $flowPrefix --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          $flowMarker = Get-Content "$flowPrefix/.flow-install.json" -Raw | ConvertFrom-Json
          $flowInstalled = Join-Path $flowPrefix $flowMarker.version
          $flowRegistry = Get-ItemProperty 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/FlowDownloadManager'
          if ($flowRegistry.DisplayVersion -ne $flowMarker.version) { throw 'Installed apps registration missing' }
          $flowRunPython = Join-Path $flowInstalled 'runtime/python.exe'
          $flowProcess = Start-Process $flowRunPython -ArgumentList @('-I', "`"$flowInstalled/launch.py`"", '--no-browser', '--port', '8876', '--directory', "`"$env:RUNNER_TEMP/FlowDownloads`"") -PassThru
          try {
            $flowHealthy = $false
            for ($i=0; $i -lt 100; $i++) {
              try {
                $flowHealth = Invoke-RestMethod 'http://127.0.0.1:8876/api/health'
                if ($flowHealth.app -eq 'flow') { $flowHealthy = $true; break }
              } catch { Start-Sleep -Milliseconds 100 }
            }
            if (-not $flowHealthy) { throw 'Bundled Windows app did not start' }
            $flowPage = Invoke-WebRequest 'http://127.0.0.1:8876/'
            if ($flowPage.Content -notmatch 'Your downloads') { throw 'Packaged UI missing' }
            $flowHostPath = (Get-Item 'HKCU:/Software/Google/Chrome/NativeMessagingHosts/com.maruf2103.flow').GetValue('')
            if (-not (Test-Path $flowHostPath)) { throw 'Chrome native host registration missing' }
            python tools/chrome_smoke.py --python $flowRunPython
            if ($LASTEXITCODE -ne 0) { throw 'Chrome extension native integration failed' }
            & $flowRunPython -I "$flowInstalled/launch.py" --no-browser --port 8876
            if ($LASTEXITCODE -ne 0) { throw 'Existing-instance reuse failed' }
            Invoke-RestMethod 'http://127.0.0.1:8876/api/shutdown' -Method Post -ContentType application/json -Body '{}'
            $flowProcess.WaitForExit(10000) | Out-Null
            if (-not $flowProcess.HasExited -or $flowProcess.ExitCode -ne 0) { throw 'Clean shutdown failed' }
          } finally {
            if (-not $flowProcess.HasExited) { $flowProcess.Kill() }
          }
          & $flowRunPython -I "$flowInstalled/uninstall.py" --prefix $flowPrefix --yes
          if ($LASTEXITCODE -ne 0) { throw 'Uninstaller failed' }
          for ($i=0; $i -lt 100 -and (Test-Path $flowPrefix); $i++) { Start-Sleep -Milliseconds 100 }
          if (Test-Path $flowPrefix) { throw 'Uninstaller left application files behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Windows-x64
          path: |
            dist/Flow-*-Windows-x64.zip
            dist/Flow-*-Windows-x64.zip.sha256
